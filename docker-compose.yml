# Local development services for DepGuard Scanner.
#
#   docker compose up -d db      start PostgreSQL in the background
#   docker compose ps            check it is "healthy"
#   docker compose logs -f db    follow the database logs
#   docker compose down          stop it (data is kept in the pgdata volume)
#   docker compose down -v       stop it AND delete all data
#
# Host port 5433 is used because a locally installed PostgreSQL usually owns 5432.
# Values below are development defaults; override them in a root-level .env file.

services:
  db:
    image: postgres:18-alpine
    container_name: depguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-depguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-depguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-depguard}
    ports:
      # Bound to 127.0.0.1 so the database is reachable only from this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
